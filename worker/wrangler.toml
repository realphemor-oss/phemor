# 非莫激活服务（Cloudflare Worker）。部署步骤见 docs/license.md「联网激活」一节。
name = "phemor-activate"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# 只接管 phemor.com/api/*，网站本身仍由 GitHub Pages 提供
routes = [
  { pattern = "phemor.com/api/*", zone_name = "phemor.com" },
  { pattern = "www.phemor.com/api/*", zone_name = "phemor.com" },
]

[vars]
# 单词包密钥版本，要和 scripts/license/products.json 里的 kv 保持一致
PACK_KV = "1"

[[d1_databases]]
binding = "DB"
database_name = "phemor"
# 运行 npx wrangler d1 create phemor 后，把输出里的 database_id 填到这里
database_id = "386ea11e-ed4a-4cfa-ab41-9385203aab26"
